<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t1a02-List-threejs-river.html</title>
<script>
/* Apply the saved theme, or default to dark before first paint. */
(function () {
  var mySaved = null;
  try { mySaved = localStorage.getItem('river-theme'); } catch (myError) {}
  var myDark = mySaved === null ? true : mySaved === 'dark';
  document.documentElement.setAttribute('data-theme', myDark ? 'dark' : 'light');
})();
</script>
<style>
/* ============================================================
   Shared design system — light default, dark via data-theme
   ============================================================ */

:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --panel: #ffffff;
  --ink: #0b0d10;
  --ink-2: #3d4653;
  --ink-3: #6b7480;
  --line: #e6e8ec;
  --line-2: #d3d7de;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: #eef3ff;
  --ok: #047857;
  --ok-soft: #e7f6ef;
  --warn: #a16207;
  --warn-soft: #fdf6e3;
  --code-bg: #0b0f17;
  --code-ink: #dbe4ee;
  --code-line: #1b2431;
  --chart-bg: #0b1220;
  --chart-line: #1b2536;
  --shadow-sm: 0 1px 2px rgba(11, 13, 16, .05);
  --shadow-md: 0 6px 20px -8px rgba(11, 13, 16, .16), 0 1px 2px rgba(11, 13, 16, .05);
  --radius: 10px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #0a0c0f;
  --bg-soft: #12151a;
  --panel: #0e1116;
  --ink: #e8edf3;
  --ink-2: #b3bcc7;
  --ink-3: #8a939f;
  --line: #1f252d;
  --line-2: #2c333d;
  --accent: #7aa2ff;
  --accent-ink: #0a0c0f;
  --accent-soft: #141c2a;
  --ok: #4ade80;
  --ok-soft: #10231a;
  --warn: #fbbf24;
  --warn-soft: #241d0c;
  --code-bg: #06080b;
  --code-ink: #d7e0ea;
  --code-line: #1a212a;
  --chart-bg: #0b1220;
  --chart-line: #1b2536;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-md: 0 12px 34px -14px rgba(0, 0, 0, .75);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }

h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.014em; line-height: 1.28; }
p { margin: 0 0 1em; max-width: 76ch; }
ul, ol { margin: 0 0 1.1em; padding-left: 1.35em; max-width: 76ch; }
li { margin: .32em 0; }
li::marker { color: var(--ink-3); }

a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration: underline; }

hr { border: 0; border-top: 1px solid var(--line); margin: 2.2rem 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbarInner {
  max-width: 940px; margin: 0 auto; padding: 0 24px;
  height: 52px; display: flex; align-items: center; gap: 10px;
}
.brand { color: var(--ink); font-weight: 650; font-size: .9rem; letter-spacing: -0.01em; }
.brand:hover { text-decoration: none; color: var(--accent); }
.crumbSep { color: var(--line-2); font-size: .9rem; }
.crumbCode { font-family: var(--mono); font-size: .76rem; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }
.topbarSpacer { flex: 1; }
.themeToggle {
  margin: 0; width: 32px; height: 32px; padding: 0; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent; color: var(--ink-2);
  font-size: .95rem; cursor: pointer;
}
.themeToggle:hover { background: var(--bg-soft); border-color: var(--line); color: var(--ink); }
html[data-theme="light"] .iconMoon { display: none; }
html[data-theme="dark"] .iconSun { display: none; }

/* ---------- page shell ---------- */
.wrap { max-width: 940px; margin: 0 auto; padding: 44px 24px 72px; }

.pageHead { padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 34px; }
.pageHead h1 { font-size: clamp(1.75rem, 1.45rem + 1.1vw, 2.15rem); }
.lede { margin: .55em 0 0; color: var(--ink-2); font-size: 1.03rem; max-width: 70ch; }

/* section labels: <h4> is used as the eyebrow on every page */
h4 {
  margin: 2.4em 0 .85em;
  font-size: .74rem; font-weight: 700; letter-spacing: .085em; text-transform: uppercase;
  color: var(--ink-3);
}
h4 + * { margin-top: 0; }
h3 { font-size: 1.1rem; }

/* ---------- controls ---------- */
input[type=number], input[type=text], input[type=search], select, textarea {
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: 8px;
  padding: 8px 10px; font: inherit; font-size: .92rem;
  margin: 3px 6px 3px 0; max-width: 100%;
  box-shadow: inset 0 1px 1px rgba(11, 13, 16, .03);
  transition: border-color .12s ease, box-shadow .12s ease;
}
input[type=number]:focus, input[type=text]:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
select { padding-right: 26px; }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin-right: 5px; vertical-align: -2px; }

input[type=button], button, input[type=submit], input[type=reset] {
  font: inherit; font-size: .9rem; font-weight: 560; line-height: 1.2;
  cursor: pointer; color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line-2); border-radius: 8px;
  padding: 9px 14px; margin: 5px 7px 5px 0;
  box-shadow: var(--shadow-sm);
  transition: background .12s ease, border-color .12s ease, color .12s ease, transform .06s ease;
}
input[type=button]:hover, button:hover, input[type=submit]:hover, input[type=reset]:hover {
  border-color: var(--ink-3); background: var(--bg-soft);
}
input[type=button]:active, button:active, input[type=submit]:active, input[type=reset]:active { transform: translateY(1px); }
input[type=button]:disabled, button:disabled {
  cursor: default; transform: none;
  background: var(--bg-soft); border-color: var(--line-2); color: var(--ink-3);
  box-shadow: none;
}
input.primary:disabled, button.primary:disabled { color: var(--ink-3); }
input.primary, button.primary, input[type=submit] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font-weight: 600; box-shadow: 0 1px 2px rgba(37, 99, 235, .3);
}
input.primary:hover, button.primary:hover, input[type=submit]:hover {
  background: color-mix(in srgb, var(--accent) 88%, var(--ink));
  border-color: color-mix(in srgb, var(--accent) 88%, var(--ink));
}
input[type=reset] { background: transparent; box-shadow: none; color: var(--ink-2); }
label { font-size: .92rem; color: var(--ink-2); }

/* ---------- code ---------- */
code {
  font-family: var(--mono); font-size: .855em;
  background: var(--bg-soft); color: var(--ink);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  white-space: nowrap;
}
pre {
  background: var(--code-bg); color: var(--code-ink);
  border: 1px solid var(--code-line); border-radius: var(--radius);
  padding: 15px 17px; margin: 0 0 1.2em;
  font-family: var(--mono); font-size: .84rem; line-height: 1.68;
  overflow-x: auto; tab-size: 2;
}
pre code {
  background: none; border: 0; padding: 0; border-radius: 0;
  color: inherit; font-size: inherit; white-space: pre;
}
.originalPrompt { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- output panels ---------- */
[id^="myDiv"], .outPanel {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 14px 0;
  min-height: 26px;
  overflow-x: auto;
  font-size: .95rem;
}
[id^="myDiv"] code, .outPanel code { background: var(--panel); }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; margin: 4px 0 20px; font-size: .92rem; }
th {
  text-align: left; font-size: .715rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 0 12px 8px; border-bottom: 1px solid var(--line-2);
  vertical-align: bottom;
}
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
td code { color: var(--ink); }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }

/* ---------- callouts ---------- */
.note {
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 26%, var(--line));
  border-left: 3px solid var(--warn);
  border-radius: 8px;
  padding: 12px 15px; margin: 20px 0;
  font-size: .93rem; color: var(--ink-2);
}
.note b { color: var(--ink); }
.note code { background: color-mix(in srgb, var(--panel) 70%, transparent); }

.hint { color: var(--ink-3); font-size: .93rem; }
.small { font-size: .875rem; color: var(--ink-3); }

/* highlight marks used inside generated output */
.hl { color: var(--accent); font-weight: 600; }
.hl-ok { color: var(--ok); font-weight: 600; }
.hl-warn { color: var(--warn); font-weight: 600; }

/* ---------- data / canvas panels (always dark, like a code block) ---------- */
.chartBox {
  background: var(--chart-bg);
  border: 1px solid var(--chart-line);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 0;
}
.chartTall { height: 340px; }
.chartMid { height: 300px; }
.chartSmall { height: 240px; }
.chartRow { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; margin: 16px 0; }
.chartRow > * { flex: 1 1 300px; min-width: 0; }

/* ---------- index list ---------- */
.indexList { border-top: 1px solid var(--line); margin: 6px 0 30px; }
.indexRow {
  display: grid; grid-template-columns: 42px 1fr auto; gap: 5px 14px;
  align-items: baseline;
  padding: 12px 10px; margin: 0; border-bottom: 1px solid var(--line);
  color: inherit; transition: background .1s ease;
}
.indexRow:hover { background: var(--bg-soft); text-decoration: none; }
.indexRow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rowNum { font-family: var(--mono); font-size: .8rem; color: var(--ink-3); letter-spacing: .02em; }
.rowMain { min-width: 0; }
.rowTitle { display: block; font-weight: 620; font-size: 1rem; color: var(--ink); letter-spacing: -0.01em; }
.indexRow:hover .rowTitle { color: var(--accent); }
.rowDesc { display: block; font-size: .875rem; color: var(--ink-3); margin-top: 1px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag {
  font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-3); background: var(--bg-soft);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
  white-space: nowrap;
}

.siteFoot {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  flex-wrap: wrap; margin-top: 40px; padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: .82rem; color: var(--ink-3);
}
.siteFoot a { color: var(--ink-3); }
.siteFoot a:hover { color: var(--accent); }

/* ---------- event-demo helpers ---------- */
.eventRow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 4px 0 6px; }
.myPad {
  width: 190px; height: 84px;
  border: 1px dashed var(--line-2); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3); background: var(--panel);
  user-select: none; touch-action: none; cursor: pointer;
  text-align: center; font-size: .86rem; padding: 8px;
}
.myPad:hover { border-color: var(--accent); color: var(--accent); }
.myChip {
  display: inline-block;
  background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: 999px;
  padding: 7px 16px; margin: 0; cursor: grab; user-select: none;
  font-size: .9rem; color: var(--ink); box-shadow: var(--shadow-sm);
}
.myChip:hover { border-color: var(--accent); color: var(--accent); }
.log {
  font-family: var(--mono); font-size: .82rem; line-height: 1.75;
  max-height: 168px; overflow-y: auto;
}
.log .n { color: var(--ink-3); margin-right: 6px; }

/* ---------- forms inside demos ---------- */
form { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; }

/* ---------- responsive ---------- */
@media (max-width: 640px) {
  .wrap { padding: 32px 18px 56px; }
  .topbarInner { padding: 0 18px; }
  .indexRow { grid-template-columns: 34px 1fr; }
  .tags { display: none; }
  th:first-child, td:first-child { padding-left: 0; }
}

/* ---------- motion / print ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}
@media print {
  .topbar, .themeToggle { display: none !important; }
  body { background: #fff; color: #000; }
  .wrap { max-width: none; padding: 0; }
  pre, .chartBox { border: 1px solid #ccc; }
  a { color: #000; text-decoration: underline; }
}
</style>
</head>

  <div class="topbarInner">

      <svg class="iconSun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">

      </svg>
      <svg class="iconMoon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"></path>
      </svg>

</header>

<main class="wrap">
<h1 align=cente>t1a02-threejs-River.html</h1>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<input type=button value="Show Plotly" onclick="{
  this.remove();
  let myPlotlyDiv = document.createElement('div');
  myPlotlyDiv.style.width = '300px';
  myPlotlyDiv.style.height = '200px';
  document.body.appendChild(myPlotlyDiv);
  let mySocketX = [0, 1, 2];
  let mySocketY = [0, 2, 1];
  Plotly.newPlot(myPlotlyDiv, [{x: mySocketX, y: mySocketY, mode: 'lines+markers'}], {margin: {t:10, b:20, l:20, r:10}, paper_bgcolor:'transparent', plot_bgcolor:'transparent'});
}" >

<input type=button value="Show ThreeJS" onclick="{
  this.remove();
  let myScene = new THREE.Scene();
  let myCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  let myRenderer = new THREE.WebGLRenderer();
  myRenderer.setSize(200, 200);
  document.body.appendChild(myRenderer.domElement);

  let myPixel = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3)),
    new THREE.PointsMaterial({color: 0x00ff00, size: 8, sizeAttenuation: false})
  );
  myScene.add(myPixel);
  myCamera.position.z = 5;

  async function myRunAnimation() {
    myPixel.position.x = (Math.random() - 0.5) * 3;
    myPixel.position.y = (Math.random() - 0.5) * 3;
    myRenderer.render(myScene, myCamera);
    await new Promise(myResolve => setTimeout(myResolve, 100));
    requestAnimationFrame(myRunAnimation);
  }
  myRunAnimation();
}">

</footer>
</main>

<script>
function myToggleTheme() {
  let myNext = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', myNext);
  try { localStorage.setItem('river-theme', myNext); } catch (myError) {}
}
</script>
